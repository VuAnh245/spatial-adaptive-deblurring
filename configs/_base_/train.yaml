training:
  optimizer: adamw
  lr: 1.0e-4            # QĐ-04 (3): pilot 2 diverged at the 2e-4 peak (SFT-Map -11.7 dB, Baseline-L NaN) -> 1e-4
  betas: [0.9, 0.9]     # matches official NAFNet-width32 GoPro config
  weight_decay: 1.0e-3  # matches official NAFNet-width32 GoPro config
  warmup: 1000
  min_lr: 1.0e-7
  iterations: 30000     # QĐ-04, locked after pilot 4 (0.834 it/s -> 32000 fits); 30000 leaves room for slower CPU hosts
  batch_size: 8         # effective batch per optimizer step
  grad_accum: 1         # QĐ-07: if FP32 runs out of memory at batch 8, set 2 (micro-batch 4 x 2), same effective batch
  amp: false            # QĐ-07 "FP32 toàn phần": 3 pilots in a row had AMP numeric failures; NAFNet trains in FP32
  grad_clip: 1.0
  ckpt_every: 2500      # multiple of val_every: a checkpoint is written only after its val passed the floor
  val_every: 2500
  val_floor_drop: 1.0   # QĐ-04: stop (exit 4) if val PSNR < step-0 val - 1 dB; a floor, not checkpoint selection
  fail_fast_nonfinite: true  # QĐ-08 (2026-10-13): non-finite loss/grad norm stops BEFORE the optimizer step (exit 3).
                             # Runs locked at faf4a06 had no such step (nonfinite_run 0 throughout), so they are unaffected.
  diag_every: 500      # ||W|| of SFT last convs, mean |dgamma_s|, |beta_s| per stage -> diag.jsonl
  num_workers: 2        # two runs share one Kaggle T4 x2 session (4 vCPU): 2 loader workers each
loss:
  charbonnier_eps: 1.0e-3
  lambda_map: 0.0
hardware: {gpu: null, cuda: null, pytorch: null}   # filled automatically by train.py
