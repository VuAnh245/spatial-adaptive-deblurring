training:
  optimizer: adamw
  lr: 1.0e-4            # QĐ-04 (3): pilot 2 diverged at the 2e-4 peak (SFT-Map -11.7 dB, Baseline-L NaN) -> 1e-4
  betas: [0.9, 0.9]     # matches official NAFNet-width32 GoPro config
  weight_decay: 1.0e-3  # matches official NAFNet-width32 GoPro config
  warmup: 1000
  min_lr: 1.0e-7
  iterations: 40000     # adjust after the pilot; identical for every variant
  batch_size: 8
  amp: true
  grad_clip: 1.0
  ckpt_every: 5000
  val_every: 5000
  val_floor_drop: 1.0   # QĐ-04: stop (exit 4) if val PSNR < step-0 val - 1 dB; a floor, not checkpoint selection
  diag_every: 500      # ||W|| of SFT last convs, mean |dgamma_s|, |beta_s| per stage -> diag.jsonl
  num_workers: 2        # two runs share one Kaggle T4 x2 session (4 vCPU): 2 loader workers each
loss:
  charbonnier_eps: 1.0e-3
  lambda_map: 0.0
hardware: {gpu: null, cuda: null, pytorch: null}   # filled automatically by train.py
